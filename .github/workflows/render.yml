name: Render
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export the ads and both stories with the bundled typefaces
        run: |
          python render_ads.py --fonts bundled --output-dir "$RUNNER_TEMP/exports"
          python render_stories.py --fonts bundled --output-dir "$RUNNER_TEMP/exports"
          test "$(ls "$RUNNER_TEMP/exports" | wc -l)" -eq 10
      - name: The published exports have the sizes and length the README states
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          from render_stories import verify_video
          for name, size in (("cirrus-square", (1080, 1080)), ("formline-square", (1080, 1080)),
                             ("cirrus-vertical", (1080, 1350)), ("formline-vertical", (1080, 1350))):
              assert Image.open(f"exports/{name}.png").size == size, name
          for name in ("cirrus", "formline"):
              assert verify_video(Path(f"exports/{name}-story.mp4")) == 168, name
          print("published exports match the README")
          EOF
